name: CatGuard

options:
  bundleIdPrefix: com.oanaffg
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

fileGroups:
  - Resources/Brand

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: RY297J6VR2
    ENABLE_USER_SCRIPT_SANDBOXING: true
    GENERATE_INFOPLIST_FILE: false
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  CatGuard:
    type: application
    platform: macOS
    sources:
      - path: Sources/CatGuardApp
      - path: Sources/CatGuardCore
        excludes:
          - PresenceStateMachine.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oanaffg.CatGuard
        PRODUCT_NAME: CatGuard
        INFOPLIST_FILE: Config/CatGuard-Info.plist
        ENABLE_APP_INTENTS_METADATA_EXTRACTION: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    entitlements:
      path: Config/CatGuard.entitlements
    dependencies:
      - sdk: AppKit.framework
      - sdk: AppIntents.framework
      - sdk: CoreGraphics.framework
      - sdk: Security.framework
      - sdk: ServiceManagement.framework
      - sdk: UserNotifications.framework

schemes:
  CatGuard:
    build:
      targets:
        CatGuard: all
    run:
      config: Debug
    archive:
      config: Release
